name: Calendario de contribuciones del perfil

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/actividad.py'
      - '.github/workflows/update-uptime.yml'

permissions:
  contents: write

concurrency:
  group: calendario-del-perfil
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar calendario anual
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/actividad.py
      - name: Guardar calendario
        run: |
          git add -- assets/actividad.svg assets/actividad-movil.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Actualizar calendario del perfil'
          git pull --rebase origin main
          git push origin HEAD:main
