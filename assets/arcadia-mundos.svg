    <path d="M-19.6 -67.4 -158.4 25M-48.9 -63.9 164.7 -13.1 M-1.8 -63.1 -140.6 29.3M-60.5 -56.2 153.1 -5.4 M16 -58.9 -122.8 33.5M-72.1 -48.5 141.5 2.3 M33.8 -54.7 -105 37.7M-83.7 -40.8 129.9 10 M51.6 -50.4 -87.2 42M-95.2 -33.1 118.4 17.7 M69.4 -46.2 -69.4 46.2M-106.8 -25.4 106.8 25.4 M87.2 -42 -51.6 50.4M-118.4 -17.7 95.2 33.1 M105 -37.7 -33.8 54.7M-129.9 -10 83.7 40.8 M122.8 -33.5 -16 58.9M-141.5 -2.3 72.1 48.5 M140.6 -29.3 1.8 63.1M-153.1 5.4 60.5 56.2 M158.4 -25 19.6 67.4M-164.6 13.1 49 63.9" fill="none" stroke="#b0ced1" opacity=".24" stroke-width=".65"/>
    <path d="M20.2 -25.5 23.8 -24.7 23.8 -73.7 20.2 -74.5z" fill="#9367c9"/><path d="M23.8 -24.7 26.1 -26.2 26.1 -75.2 23.8 -73.7z" fill="#655397"/><path d="M22.5 -76 26.1 -75.2 23.8 -73.7 20.2 -74.5z" fill="#dbafff"/>
    <path d="M43.3 -20 46.9 -19.2 46.9 -68.2 43.3 -69z" fill="#9367c9"/><path d="M46.9 -19.2 49.2 -20.7 49.2 -69.7 46.9 -68.2z" fill="#655397"/><path d="M45.7 -70.5 49.2 -69.7 46.9 -68.2 43.3 -69z" fill="#dbafff"/>
    <path class="portal-shimmer" style="--d:0s" d="M24.9 -25.4 44.5 -20.8 44.5 -69.8 24.9 -74.4z" fill="url(#membrane)" filter="url(#glow)"/>
    <path d="M20.2 -74.5 46.9 -68.2 46.9 -75.2 20.2 -81.5z" fill="#dda668"/><path d="M46.9 -68.2 49.2 -69.7 49.2 -76.7 46.9 -75.2z" fill="#9b695b"/><path d="M22.5 -83 49.2 -76.7 46.9 -75.2 20.2 -81.5z" fill="#ffe6a8"/>
    <path d="M30 -2.3 42.5 0.7 42.5 -48.3 30 -51.3z" fill="#dda668"/><path d="M42.5 0.7 50.6 -4.7 50.6 -53.7 42.5 -48.3z" fill="#9b695b"/><path d="M38.1 -56.7 50.6 -53.7 42.5 -48.3 30 -51.3z" fill="#ffe6a8"/>
    <g class="crystal" filter="url(#glow)">
      <path d="M-15.3 -50.2 -21.5 -32.4 -19.4 -28.2z" fill="#b1fff2"/><path d="M-15.3 -13.4 -19.4 -28.2 -21.5 -32.4z" fill="#278695"/><path d="M-15.3 -13.4 -9.1 -29.4 -19.4 -28.2z" fill="#268caf"/><path d="M-15.3 -50.2 -19.4 -28.2 -9.1 -29.4z" fill="#5fe0e5"/>
    </g>
    <path d="M-11.7 1.4 2.5 4.8 2.5 -26.7 -11.7 -30.1z" fill="#59b5db"/><path d="M2.5 4.8 11.7 -1.4 11.7 -32.9 2.5 -26.7z" fill="#4178a8"/><path d="M-2.5 -36.3 11.7 -32.9 2.5 -26.7 -11.7 -30.1z" fill="#a5e3fc"/>
  </g>

