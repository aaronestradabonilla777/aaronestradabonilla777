    <path d="M-176.2 33 37.4 83.9 37.4 71.6 -176.2 20.8z" fill="#47364f"/><path d="M37.4 83.9 176.2 -8.5 176.2 -20.8 37.4 71.6z" fill="#342c46"/><path d="M-37.4 -71.6 176.2 -20.8 37.4 71.6 -176.2 20.8z" fill="url(#magenta)"/>
    <path d="M-19.6 -67.4 -158.4 25M-48.9 -63.9 164.7 -13.1 M-1.8 -63.1 -140.6 29.3M-60.5 -56.2 153.1 -5.4 M16 -58.9 -122.8 33.5M-72.1 -48.5 141.5 2.3 M33.8 -54.7 -105 37.7M-83.7 -40.8 129.9 10 M51.6 -50.4 -87.2 42M-95.2 -33.1 118.4 17.7 M69.4 -46.2 -69.4 46.2M-106.8 -25.4 106.8 25.4 M87.2 -42 -51.6 50.4M-118.4 -17.7 95.2 33.1 M105 -37.7 -33.8 54.7M-129.9 -10 83.7 40.8 M122.8 -33.5 -16 58.9M-141.5 -2.3 72.1 48.5 M140.6 -29.3 1.8 63.1M-153.1 5.4 60.5 56.2 M158.4 -25 19.6 67.4M-164.6 13.1 49 63.9" fill="none" stroke="#b0ced1" opacity=".24" stroke-width=".65"/>
    <path d="M20.2 -25.5 23.8 -24.7 23.8 -73.7 20.2 -74.5z" fill="#39b9c6"/><path d="M23.8 -24.7 26.1 -26.2 26.1 -75.2 23.8 -73.7z" fill="#25899b"/><path d="M22.5 -76 26.1 -75.2 23.8 -73.7 20.2 -74.5z" fill="#a6fff1"/>
    <path d="M43.3 -20 46.9 -19.2 46.9 -68.2 43.3 -69z" fill="#39b9c6"/><path d="M46.9 -19.2 49.2 -20.7 49.2 -69.7 46.9 -68.2z" fill="#25899b"/><path d="M45.7 -70.5 49.2 -69.7 46.9 -68.2 43.3 -69z" fill="#a6fff1"/>
    <path class="portal-shimmer" style="--d:-1.2s" d="M24.9 -25.4 44.5 -20.8 44.5 -69.8 24.9 -74.4z" fill="url(#membrane)" filter="url(#glow)"/>
    <path d="M20.2 -74.5 46.9 -68.2 46.9 -75.2 20.2 -81.5z" fill="#dda668"/><path d="M46.9 -68.2 49.2 -69.7 49.2 -76.7 46.9 -75.2z" fill="#9b695b"/><path d="M22.5 -83 49.2 -76.7 46.9 -75.2 20.2 -81.5z" fill="#ffe6a8"/>
    <path d="M-25.7 -11.9 -13.2 -8.9 -13.2 -64.9 -25.7 -67.9z" fill="#55ba98"/><path d="M-13.2 -8.9 -5.1 -14.3 -5.1 -70.3 -13.2 -64.9z" fill="#32817b"/><path d="M-17.6 -73.2 -5.1 -70.3 -13.2 -64.9 -25.7 -67.9z" fill="#a6f6ce"/>
    <path d="M25.9 0.4 38.4 3.4 38.4 -52.6 25.9 -55.6z" fill="#dd69a3"/><path d="M38.4 3.4 46.5 -2 46.5 -58 38.4 -52.6z" fill="#93496f"/><path d="M34 -61 46.5 -58 38.4 -52.6 25.9 -55.6z" fill="#ffc0df"/>
    <g class="levitate">
      <path d="M-33.9 9.7 -5.4 16.5 -5.4 1.6 -33.9 -5.2z" fill="#dda668"/><path d="M-5.4 16.5 8.5 7.2 8.5 -7.6 -5.4 1.6z" fill="#9b695b"/><path d="M-20 -14.4 8.5 -7.6 -5.4 1.6 -33.9 -5.2z" fill="#ffe6a8"/>
