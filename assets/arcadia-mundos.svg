  </g>

  <!-- Bidirectional warp conduits -->
  <path d="M235 104q85-52 142-12 45 31 32 85-17 65 31 77 38 11 65 14" fill="none" stroke="#85cbc6" opacity=".45" stroke-width="1.6" stroke-dasharray="2 5"/>
  <path class="packet" pathLength="100" d="M235 104q85-52 142-12 45 31 32 85-17 65 31 77 38 11 65 14" fill="none" stroke="#8cfcf4" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="10 101" filter="url(#glow)"/>
  <path class="packet-rev" pathLength="100" d="M235 104q85-52 142-12 45 31 32 85-17 65 31 77 38 11 65 14" fill="none" stroke="#ff78be" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="8 103" filter="url(#glow)"/>

  <g font-family="Bahnschrift,Arial,sans-serif" font-weight="700" fill="#ffefd9"><text x="28" y="49" font-size="30">Mundo 01</text><text x="645" y="435" text-anchor="end" font-size="30">Mundo 02</text></g>
  <g font-family="Consolas,monospace" font-size="15" fill="#9be7e5"><text x="30" y="73">Monolitos y cristal</text><text x="644" y="457" text-anchor="end">Torres y plataforma</text></g>
