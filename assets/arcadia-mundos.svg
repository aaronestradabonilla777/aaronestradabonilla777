<svg xmlns="http://www.w3.org/2000/svg" width="680" height="462" viewBox="0 0 680 462" role="img" aria-labelledby="title desc">
  <title id="title">Arcadia · Tránsito entre mundos</title>
  <desc id="desc">Las dos escenas de Urano conectadas por portales energéticos animados entre Mundo 01 y Mundo 02.</desc>
  <defs>
    <linearGradient id="air" x2=".86" y2="1"><stop stop-color="#0d192a"/><stop offset=".5" stop-color="#1e223d"/><stop offset="1" stop-color="#3b263d"/></linearGradient>
    <linearGradient id="ocean" x2=".15" y2="1"><stop stop-color="#4e808e"/><stop offset="1" stop-color="#223a52"/></linearGradient>
    <linearGradient id="magenta" x2=".22" y2="1"><stop stop-color="#9b6688"/><stop offset="1" stop-color="#44375c"/></linearGradient>
    <linearGradient id="membrane" x2="0" y2="1"><stop stop-color="#d2fff2" stop-opacity=".95"/><stop offset="1" stop-color="#00f5e9" stop-opacity=".28"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#7ce9d5" stop-opacity=".28"/><stop offset="1" stop-color="#7ce9d5" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo-m"><stop stop-color="#ff78be" stop-opacity=".25"/><stop offset="1" stop-color="#ff78be" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @media(prefers-reduced-motion:no-preference){
        .packet{animation:travel 4.2s linear infinite}
        .packet-rev{animation:travel-rev 5.4s linear -1.5s infinite}
        .pulse{animation:breathe 3.2s ease-in-out infinite alternate}
        .levitate{animation:floaty 4s ease-in-out infinite alternate}
        .portal-shimmer{animation:portal 2.4s ease-in-out var(--d,0s) infinite alternate}
        .crystal{animation:bob 3s ease-in-out infinite alternate}
        @keyframes travel{to{stroke-dashoffset:-111}}
        @keyframes travel-rev{to{stroke-dashoffset:111}}
        @keyframes breathe{from{opacity:.25;transform:scale(.96)}to{opacity:.78;transform:scale(1.04)}}
        @keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-6px)}}
        @keyframes portal{from{opacity:.42}to{opacity:.95}}
        @keyframes bob{from{transform:translateY(2px)}to{transform:translateY(-5px)}}
      }
    </style>
  </defs>
  <rect width="680" height="462" rx="8" fill="url(#air)" stroke="#294e60"/>
  <g fill="none" stroke="#a2d5dc" opacity=".16"><path d="M0 308 389 86l291 152M0 319 389 97l291 152M67 462l417-240 196 103M46 462l438-251 196 103"/></g>
  <ellipse class="pulse" cx="210" cy="144" rx="187" ry="129" fill="url(#halo)"/>
  <ellipse class="pulse" cx="485" cy="312" rx="170" ry="118" fill="url(#halo-m)"/>

