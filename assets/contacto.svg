<svg xmlns="http://www.w3.org/2000/svg" width="800" height="106" viewBox="0 0 800 106" role="img" aria-labelledby="title">
  <title id="title">Contactar a Haluz en LinkedIn</title>
  <defs>
    <pattern id="map-grid" width="14" height="14" patternUnits="userSpaceOnUse">
