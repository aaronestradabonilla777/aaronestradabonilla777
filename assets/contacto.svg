    <use href="#uplink" stroke="#49aab2" stroke-width="3"/>
    <use href="#return" class="reply" stroke="#ffb2ac" stroke-width="3" stroke-dasharray="2 98"/>
    <use href="#uplink" class="traffic" stroke="#c9fff0" stroke-width="4" stroke-dasharray="3 97"/>
