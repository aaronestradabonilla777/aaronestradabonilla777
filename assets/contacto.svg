      <path d="M-64-5h42m47 0h25m24 0h16" stroke="#67f7e4" stroke-width="2.2"/>
      <path d="M-49-36v-3h21l4 3m55 2v-4h24v4" fill="#42515b" stroke="#caada2"/>
