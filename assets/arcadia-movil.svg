        .glove { animation:reach 8s ease-in-out infinite }
        .float { animation:float 6s ease-in-out infinite alternate }
        .face-top { animation:yaw-top 9s linear infinite alternate }
        .face-left { animation:yaw-left 9s linear infinite alternate }
        .face-right { animation:yaw-right 9s linear infinite alternate }
        .rotor { transform-origin:0 0; animation:turn 85s linear infinite }
        .sweep { animation:sweep 3.4s ease-out infinite; transform-origin:0 0 }
        .dust { animation:dust 8s ease-in-out infinite alternate }
        .marker { animation:lock 6s ease-in-out infinite alternate }
      }
      @keyframes distance { to { transform:translate(4px,-1px) } }
      @keyframes gorge { to { transform:translate(-5px,1px) } }
      @keyframes deck { to { transform:translate(-10px,2px) } }
      @keyframes reach { 0%,100% {transform:translate(0,0)} 52%,65% {transform:translate(-15px,-9px) rotate(-1deg)} }
      @keyframes float { to { transform:translateY(-9px) } }
      @keyframes yaw-left {
        0% {transform:matrix(0.83,0.17,0,0.9,-83,-17)}
        25% {transform:matrix(0.78,0.19,0,0.9,-78,-19)}
        50% {transform:matrix(0.72,0.21,0,0.9,-72,-21)}
        75% {transform:matrix(0.655,0.228,0,0.9,-65.5,-22.8)}
        100% {transform:matrix(0.58,0.25,0,0.9,-58,-25)}
      }
      @keyframes yaw-right {
        0% {transform:matrix(0.56,-0.25,0,0.9,0,0)}
        25% {transform:matrix(0.625,-0.235,0,0.9,0,0)}
        50% {transform:matrix(0.695,-0.216,0,0.9,0,0)}
        75% {transform:matrix(0.757,-0.197,0,0.9,0,0)}
        100% {transform:matrix(0.815,-0.175,0,0.9,0,0)}
      }
      @keyframes yaw-top {
        0% {transform:matrix(0.83,0.17,0.56,-0.25,-83,-17)}
        25% {transform:matrix(0.78,0.19,0.625,-0.235,-78,-19)}
