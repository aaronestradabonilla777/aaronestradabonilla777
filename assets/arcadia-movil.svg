        75% {transform:matrix(0.655,0.228,0.757,-0.197,-65.5,-22.8)}
        100% {transform:matrix(0.58,0.25,0.815,-0.175,-58,-25)}
      }
      @keyframes turn { to {transform:rotate(360deg)} }
      @keyframes sweep { from {transform:scale(.45);opacity:.8} to {transform:scale(1.55);opacity:0} }
      @keyframes dust { to {transform:translate(19px,-9px);opacity:.48} }
      @keyframes lock { to {transform:translateY(-5px);opacity:.52} }
    </style>
