      <path d="m-4-77 .7 60m2-60v60m3-60-.4 60" fill="none" stroke="#183e4b" stroke-width="1.3"/>
      <path d="M-11-88h22l-2 5-3 3H-6l-4-3zM-8-15H8l2 4v3h-20v-3z" fill="url(#stone)" stroke="#819c93"/>
      <path d="M-11-85h22m-18 69H7" stroke="#e3bd82" stroke-width="1.3"/>
    </g>
    <g id="arcade">
      <path d="M0 0v-49h168V0h-9v-22q-10-24-20 0V0h-8v-22q-10-24-20 0V0h-8v-22q-10-24-20 0V0h-8v-22q-10-24-20 0V0h-8v-22q-10-24-20 0V0h-8v-22Q9-46 5-22V0z" fill="#24505e" stroke="#518181"/>
      <path d="M-3-49h174v5H-3z" fill="#3e6970"/><path d="M0-49h56m8 0h35m19 0h47" stroke="#89b6aa" stroke-width="1.4"/>
    </g>
    <path id="eye" d="M-100 0Q-51-46 0-44 56-43 100 0 47 42 0 43-53 44-100 0z"/>
    <clipPath id="opening"><use class="lid" href="#eye"/></clipPath>
    <g id="fish"><path d="M-7 0q5-5 12 0-7 5-12 0l-4 3v-6z" fill="#74b6ad"/></g>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        .shafts { animation:refract 7s ease-in-out infinite alternate }
        .caustic { animation:surface 11s ease-in-out infinite alternate }
        .dial { animation:orbit 40s linear infinite }
        .lid { animation:wake 12s ease-in-out infinite }
        .gaze { animation:look 12s ease-in-out infinite }
        .conduit { animation:conduct 12s linear infinite }
        .canal { animation:echo 12s ease-out infinite }
        .manta { animation:glide 17s ease-in-out infinite alternate }
        .wing { animation:undulate 3.8s ease-in-out infinite alternate }
        .school { animation:school 13s ease-in-out infinite alternate }
        .bubbles { animation:breathe 6s linear var(--delay,0s) infinite }
        .diver { animation:drift 8s ease-in-out infinite alternate }
        .fronds { animation:sway 4.7s ease-in-out infinite alternate }
        @keyframes refract { to { transform:skewX(-5deg); opacity:.62 } }
        @keyframes surface { to { transform:translateX(32px) scaleY(.72) } }
        @keyframes orbit { to { transform:rotate(360deg) } }
        @keyframes wake { 0%,22%,31%,100% { transform:scaleY(1) } 26% { transform:scaleY(.07) } }
        @keyframes look { 0%,24%,75%,100% { transform:translateX(0) } 40%,60% { transform:translateX(-10px) } }
        @keyframes conduct { 0%,30% { opacity:0; stroke-dashoffset:115 } 34% { opacity:1 } 63% { opacity:1; stroke-dashoffset:-12 } 69%,100% { opacity:0; stroke-dashoffset:-30 } }
        @keyframes echo { 0%,57% { opacity:0; transform:scale(.62) } 65% { opacity:.76 } 86%,100% { opacity:0; transform:scale(1.16) } }
        @keyframes glide { from { transform:translate(-34px,6px) rotate(-4deg) } to { transform:translate(46px,-8px) rotate(5deg) } }
        @keyframes undulate { from { transform:scaleY(.65) } to { transform:scaleY(1.14) } }
        @keyframes school { to { transform:translate(39px,-12px) } }
        @keyframes breathe { 0% { opacity:0; transform:translate(0,4px) } 20%,65% { opacity:.64 } 100% { opacity:0; transform:translate(10px,-33px) } }
        @keyframes drift { to { transform:translate(12px,-5px) rotate(-4deg) } }
        @keyframes sway { from { transform:skewX(-4deg) } to { transform:skewX(7deg) } }
      }
    </style>
  </defs>
