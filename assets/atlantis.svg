<svg xmlns="http://www.w3.org/2000/svg" width="960" height="288" viewBox="0 0 960 288" role="img" aria-labelledby="title desc">
  <title id="title">Atlantis · El santuario sumergido</title>
  <desc id="desc">Una mantarraya atraviesa la luz sobre las ruinas de la Atlántida. El ojo de oro del templo despierta y un pulso turquesa recorre las gradas hasta el canal. Abrir el recorrido del prototipo Atlantis OS.</desc>
  <defs>
    <linearGradient id="sea" x2=".85" y2="1">
      <stop stop-color="#0a172c"/><stop offset=".32" stop-color="#103445"/><stop offset=".67" stop-color="#176067"/><stop offset="1" stop-color="#091a31"/>
    </linearGradient>
    <linearGradient id="shaft" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="227"><stop stop-color="#a0ffdf" stop-opacity=".36"/><stop offset=".64" stop-color="#73ecdc" stop-opacity=".13"/><stop offset="1" stop-color="#73ecdc" stop-opacity="0"/></linearGradient>
    <radialGradient id="lagoon"><stop stop-color="#68c5ac" stop-opacity=".31"/><stop offset="1" stop-color="#416fa0" stop-opacity="0"/></radialGradient>
    <linearGradient id="chamber" x2="0" y2="1"><stop stop-color="#103245"/><stop offset=".7" stop-color="#23515c"/><stop offset="1" stop-color="#67aca1"/></linearGradient>
    <linearGradient id="stone" x2=".91" y2=".35"><stop stop-color="#102736"/><stop offset=".32" stop-color="#436a72"/><stop offset=".5" stop-color="#63848a"/><stop offset=".58" stop-color="#2a4858"/><stop offset="1" stop-color="#152c41"/></linearGradient>
    <linearGradient id="bronze" x2=".83" y2=".5"><stop stop-color="#857257"/><stop offset=".33" stop-color="#f3d9a0"/><stop offset=".57" stop-color="#b79e6c"/><stop offset="1" stop-color="#5d695f"/></linearGradient>
    <radialGradient id="lens"><stop stop-color="#ffe7a5"/><stop offset=".38" stop-color="#d69a55"/><stop offset=".72" stop-color="#758d79"/><stop offset="1" stop-color="#0c3843"/></radialGradient>
    <linearGradient id="shade"><stop stop-color="#08172a"/><stop offset=".65" stop-color="#0a1d30" stop-opacity=".86"/><stop offset="1" stop-color="#0a1d30" stop-opacity="0"/></linearGradient>
    <linearGradient id="lamp"><stop stop-color="#ffeab2" stop-opacity=".77"/><stop offset="1" stop-color="#c6fff1" stop-opacity="0"/></linearGradient>
    <pattern id="frieze" width="14" height="7" patternUnits="userSpaceOnUse"><path d="M0 6h11V1H4v3h4m3 2h3" fill="none" stroke="#d3bd86" stroke-width="1.1"/></pattern>
    <g id="kelp" fill="#102e3b" stroke="#396568" stroke-width=".7">
      <path d="M0 0Q3-19-4-27q-9-12-4-25 1 13 9 21Q9-17 2 0z"/>
      <path d="M3 0q-1-14 10-26 7-8 7-17 5 10-3 21Q6-11 6 0zM0 0q-7-14-13-17-8-6-8-17 4 9 10 11Q1-17 2 0z"/>
    </g>
    <g id="pillar">
