<svg xmlns="http://www.w3.org/2000/svg" width="384" height="186" viewBox="0 0 384 186" role="img" aria-labelledby="title desc">
  <title id="title">sdd-template</title>
  <desc id="desc">Tres agentes reciben una especificación. Cada uno devuelve una pieza y juntos completan el archivo.</desc>
  <defs>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        .request, .reply, .ack, .piece, .seal, .assembled { animation-duration:10s; animation-delay:var(--delay, 0s); animation-iteration-count:infinite; animation-timing-function:linear; animation-fill-mode:backwards }
        .piece { animation-name:assemble }
        .seal { animation-name:sealed }
        .assembled { animation-name:clear-file }
        @keyframes assemble { 0%,43% { opacity:0; transform:translateX(17px) } 51%,100% { opacity:1; transform:translateX(0) } }
        @keyframes sealed { 0%,61% { opacity:0 } 63%,100% { opacity:1 } }
        @keyframes clear-file { 0%,36%,100% { opacity:0 } 42%,97% { opacity:1 } }
        .request { animation-name:dispatch }
        .reply { animation-name:confirm }
        .ack { animation-name:received }
        @keyframes dispatch { 0% { opacity:0; stroke-dashoffset:8 } 4% { opacity:1 } 22% { opacity:1; stroke-dashoffset:-96 } 23%,100% { opacity:0; stroke-dashoffset:-100 } }
        @keyframes received { 0%,21%,55%,100% { opacity:0 } 25%,49% { opacity:1 } }
        @keyframes confirm { 0%,30% { opacity:0; stroke-dashoffset:-100 } 32% { opacity:1 } 49% { opacity:1; stroke-dashoffset:0 } 51%,100% { opacity:0; stroke-dashoffset:8 } }
      }
    </style>
    <radialGradient id="glow" cx=".48" cy=".54" r=".72">
      <stop stop-color="#51354a"/><stop offset="1" stop-color="#101923"/>
    </radialGradient>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0v14" stroke="#c49fa5" stroke-opacity=".18" fill="none"/>
    </pattern>
    <g id="agent" fill="#211e2a" stroke="#ffbc97" stroke-width="1.8">
      <path d="M-14-9h24l4 4V9h-28z"/>
    </g>
    <path id="prompt" d="m-3-3 4 3-4 3" fill="none" stroke="#ffc68d"/>
    <path id="block" d="M-3-3h6v6h-6z" fill="none" stroke="#e8afe3"/>
    <path id="tick" d="m-3 0 2 2 5-5" fill="none" stroke="#97f1d7"/>
    <path id="upper" pathLength="100" d="M167 66h29l26-35h28"/>
    <path id="middle" pathLength="100" d="M167 66h83"/>
    <path id="lower" pathLength="100" d="M167 66h29l26 35h28"/>
    <g id="check" transform="translate(34 0)">
      <rect x="252" y="-8" width="25" height="16" rx="2" fill="#285352" stroke="#b5ffe0"/>
      <path d="m259-1 4 4 7-7" fill="none" stroke="#b5ffe0" stroke-width="2"/>
    </g>
  </defs>
  <rect x=".5" y=".5" width="383" height="185" rx="5" fill="#08161e" stroke="#315561"/>
  <path d="M1 6q0-5 5-5h372q5 0 5 5v125H1z" fill="url(#glow)"/>
  <path d="M1 6h382v125H1z" fill="url(#grid)"/>
  <g fill="none" stroke="#ee9c91" stroke-width="2">
    <use href="#upper"/><use href="#middle"/><use href="#lower"/>
    <circle cx="196" cy="66" r="4" fill="#ffcf9b"/>
  </g>
  <use href="#agent" x="265" y="31"/><use href="#agent" x="265" y="66"/><use href="#agent" x="265" y="101"/>
  <g stroke-width="2.3" stroke-linejoin="round">
    <use href="#prompt" transform="translate(265 31) scale(1.55)"/>
    <use href="#block" transform="translate(265 66) scale(1.55)"/>
    <use href="#tick" transform="translate(265 101) scale(1.55)"/>
  </g>
  <g fill="none" stroke-width="3">
    <g style="--delay:0s">
      <use class="request" href="#upper" opacity="0" stroke="#fff1c7" stroke-dasharray="7 105"/>
      <use class="reply" href="#upper" opacity="0" stroke="#91efd4" stroke-dasharray="7 105"/>
      <use class="ack" href="#check" y="31" opacity="0"/>
    </g>
    <g style="--delay:.5s">
      <use class="request" href="#middle" opacity="0" stroke="#fff1c7" stroke-dasharray="7 105"/>
      <use class="reply" href="#middle" opacity="0" stroke="#91efd4" stroke-dasharray="7 105"/>
      <use class="ack" href="#check" y="66" opacity="0"/>
    </g>
    <g style="--delay:1s">
      <use class="request" href="#lower" opacity="0" stroke="#fff1c7" stroke-dasharray="7 105"/>
      <use class="reply" href="#lower" opacity="0" stroke="#91efd4" stroke-dasharray="7 105"/>
      <use class="ack" href="#check" y="101" opacity="0"/>
    </g>
  </g>
  <path d="M97 36h48l16 16v56H97z" fill="#302532" stroke="#ad727c"/>
  <path d="M104 28h48l16 16v56h-64z" fill="#432d3b" stroke="#ffd3ad" stroke-width="2"/>
  <path d="M152 29v15h15m-51 12h36m-36 12h28m-28 12h32" fill="none" stroke="#987986" stroke-dasharray="2 3"/>
  <g class="assembled">
    <g fill="none" stroke-width="2.4">
      <g class="piece" style="--delay:0s"><use href="#prompt" x="117" y="56"/><path d="M123 56h24" stroke="#ffc68d"/></g>
      <g class="piece" style="--delay:.5s"><use href="#block" x="117" y="68"/><path d="M123 68h18" stroke="#e8afe3"/></g>
      <g class="piece" style="--delay:1s"><use href="#tick" x="117" y="80"/><path d="M123 80h24" stroke="#97f1d7"/></g>
    </g>
    <g class="seal"><circle cx="161" cy="97" r="10" fill="#173d39" stroke="#a7f4cd"/><path d="m156 97 3 3 6-7" fill="none" stroke="#c3ffe2" stroke-width="2"/></g>
  </g>
  <path d="M0 132h384" stroke="#315561"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="18" y="167" fill="#e7f9fa" font-size="27" font-weight="700">sdd-template</text>
  </g>
  <g transform="translate(348 167) scale(.72)"><path d="M0 0l22-22m-16 1 16-1v16" fill="none" stroke="#ffba9e" stroke-width="3.7"/></g>
</svg>
